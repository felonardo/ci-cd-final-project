apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pipeline-pvc
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: skills-network-learner
  resources:
    requests:
      storage: 1Gi
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: ci-cd-final-project
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-cd-final-project
  labels:
    app: ci-cd-final-project
spec:
  # The deploy task starts the application after the first image is built.
  replicas: 0
  selector:
    matchLabels:
      app: ci-cd-final-project
  template:
    metadata:
      labels:
        app: ci-cd-final-project
    spec:
      containers:
        - name: counter
          image: ci-cd-final-project:latest
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ci-cd-final-project
spec:
  selector:
    app: ci-cd-final-project
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ci-cd-final-project
spec:
  to:
    kind: Service
    name: ci-cd-final-project
  port:
    targetPort: http
